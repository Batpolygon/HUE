<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HUE bubble</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", "Trebuchet MS", sans-serif;
      }
      #bubble {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(18, 20, 28, 0.94);
        color: #f2f4f8;
        border: 1px solid rgba(255, 255, 255, 0.14);
        font-size: 11px;
        line-height: 1.3;
        word-break: break-word;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        transition: border-color 0.3s ease;
      }
      #bubble.k-achievement {
        border-color: rgba(255, 202, 40, 0.8);
        background: linear-gradient(135deg, rgba(40, 32, 10, 0.95), rgba(18, 20, 28, 0.95));
      }
      #bubble.k-greeting,
      #bubble.k-event {
        border-color: rgba(255, 138, 31, 0.6);
      }
      #bubble.k-thought {
        font-style: italic;
        border-style: dashed;
      }
      #bubble.k-lag {
        border-color: rgba(239, 83, 80, 0.6);
      }
      #bubble.k-timer {
        border-color: rgba(79, 195, 247, 0.7);
      }
      #bubble.k-status {
        color: #9aa3b5;
      }
    </style>
  </head>
  <body>
    <div id="bubble"></div>
    <script type="module" src="/src/bubble.ts"></script>
  </body>
</html>
